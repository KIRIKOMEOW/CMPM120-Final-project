<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Gameplay Prototype - Music Drift Runner</title>
    <link rel="icon" href="data:," />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: #050611;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        min-height: 100svh;
        touch-action: none;
        user-select: none;
      }

      canvas {
        display: block;
        touch-action: none;
        user-select: none;
      }
    </style>
  </head>

  <body>
    <div id="game"></div>

    <script src="./lib/phaser.js"></script>
    <script src="./gameplay.js"></script>
  </body>
</html>
