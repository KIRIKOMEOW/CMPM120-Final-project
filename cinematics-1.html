<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinematics Prototype 1</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #101820;
        color: #f2f4f3;
      }

      main {
        width: min(760px, calc(100% - 32px));
      }

      .frame {
        aspect-ratio: 16 / 9;
        display: grid;
        place-items: center;
        padding: 24px;
        border: 2px solid #f2aa4c;
        background: linear-gradient(#182635, #0b1118);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cinematics Prototype 1</h1>
      <section class="frame" aria-label="cinematic storyboard frame">
        <p>Cinematic prototype: opening story beat, camera framing, and dramatic timing test.</p>
      </section>
    </main>
  </body>
</html>
