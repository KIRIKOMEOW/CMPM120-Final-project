<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scene Flow Prototype 1</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f9fb;
        color: #1f2933;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .flow {
        display: grid;
        gap: 16px;
      }

      .step {
        border-left: 6px solid #3f88c5;
        padding: 16px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Scene Flow Prototype 1</h1>
      <section class="flow" aria-label="scene flow">
        <div class="step">Title screen: start game and choose settings.</div>
        <div class="step">Exploration scene: introduce the player objective.</div>
        <div class="step">Challenge scene: test the first obstacle.</div>
        <div class="step">Results scene: show outcome and restart path.</div>
      </section>
    </main>
  </body>
</html>
